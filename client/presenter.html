<!doctype html>
<!--
	reveal.js-presenter — the presenter view, for an iPad, tablet or phone.

	Shows the current slide, the next slide or fragment, the speaker notes, a
	clock and a timer, following whichever deck is open somewhere with
	?master=<secret> (see presenter-master.js).  The two sides talk only through
	the relay, so they need nothing in common but an internet connection; venue
	WiFi often stops devices from reaching each other directly.

	Both slides are the deck itself, loaded twice in iframes and driven through
	their window.Reveal, which is why this page must be served from the same
	origin as the decks.  The copies are loaded with ?presenter added to the
	deck's address, which presenter-master.js in them takes as "a copy on the
	tablet": with questions on, it runs there as a mirror of the laptop (see
	presenter-mirror.js).

	?deck=/path/to/deck.html loads a deck straight away, before the laptop speaks.

	The current slide shows what the laptop's screen does: the deck's own
	controls, the overview and a blanked screen (here), and, with the
	questions key, whatever is drawn on it there (presenter-ink.js) and what
	else the laptop's deck draws, the question QR code, polls and their charts,
	the board, reactions (presenter-mirror.js).  Drive (presenter-driver.js,
	with the key) makes this the laptop's pen: the Apple Pencil writes on the
	laptop's slide with the deck's pen, or on its chalkboard, and ◀ ▶ step
	through the talk.  Drive and the ink need the chalkboard plugin in
	vendor/chalkboard, in the deck.

	Reload (two taps) reloads the page and both copies with every file fetched
	afresh: a Home Screen web app has no reload button of its own.
-->
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black">
	<meta name="robots" content="noindex">
	<title>Presenter view</title>
	<script src="presenter-config.js"></script>
	<style>
		:root {
			--bg: #141414;
			--panel: #1f1f1f;
			--text: #ececec;
			--muted: #8d8d8d;
			--ok: #3fb950;
			--warn: #e3a43b;
			--bad: #e5534b;
			--notes-size: 22px;
			--deck-aspect: 16 / 9;
			color-scheme: dark;
		}
		* { box-sizing: border-box; }
		[hidden] { display: none !important; }
		html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
			font-family: -apple-system, system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
		body { display: flex; flex-direction: column; height: 100dvh;
			padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
		button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid #3a3a3a;
			border-radius: 8px; padding: 6px 12px; cursor: pointer; }

		header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; font-size: 15px; flex: none; }
		.status { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
		.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); }
		.status.ok .dot { background: var(--ok); }
		.status.warn .dot { background: var(--warn); }
		.status.bad .dot { background: var(--bad); }
		.title { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		.spacer { flex: 1; }
		#reload { white-space: nowrap; }
		#reload.armed { border-color: var(--bad); color: var(--bad); }	/* "Tap again": waiting for its second tap */

		/* minmax(0, …): no column may grow to fit its content, or a long line on
		   the right (a word cloud's heading, set on one line) widens that column
		   and shrinks the current slide to a thumbnail. */
		main { flex: 1; min-height: 0; display: grid; gap: 12px; padding: 0 12px 12px;
			grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); grid-template-rows: auto minmax(0, 1fr);
			grid-template-areas: "current next" "notes clock"; }
		@media (orientation: portrait) {
			main { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr);
				grid-template-areas: "current current" "next clock" "notes notes"; }
		}

		.frame { position: relative; aspect-ratio: var(--deck-aspect); background: #000; border-radius: 6px; overflow: hidden; }
		/* Laid out at a fixed FRAME_WIDTH and scaled to fit; see the script. */
		.frame iframe { position: absolute; top: 0; left: 0; width: 1280px; height: 720px; border: 0;
			pointer-events: none; transform-origin: 0 0; transform: scale(var(--scale, 0.5)); }
		.current { grid-area: current; }
		.next-col { grid-area: next; }
		.label { color: var(--muted); font-size: 14px; margin-bottom: 4px; }
		.overlay-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
			text-align: center; padding: 24px; background: rgba(20, 20, 20, 0.85); font-size: 18px; line-height: 1.4; }
		.badge { position: absolute; top: 10px; left: 10px; padding: 4px 10px; border-radius: 6px;
			background: var(--warn); color: #000; font-weight: 600; font-size: 15px; }
		/* This copy of the deck is not the laptop's version (see checkCopies()). */
		.mismatch { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 14px; background: var(--bad);
			color: #fff; font-weight: 600; font-size: 16px; line-height: 1.35; text-align: center; }

		.notes { grid-area: notes; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--panel);
			border-radius: 6px; padding: 4px 18px; font-size: var(--notes-size); line-height: 1.4;
			-webkit-user-select: text; user-select: text; }
		.notes .none { color: var(--muted); }

		.clock-col { grid-area: clock; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
		.counter { color: var(--muted); font-size: 20px; }
		.clock { font-size: 34px; font-variant-numeric: tabular-nums; }
		.timer { font-size: 56px; font-variant-numeric: tabular-nums; padding: 2px 20px; border: none; background: none; }
		.timer.paused { color: var(--warn); }

		/* With audience questions on, the clock and timer shrink to one line and the
		   questions take the rest of the corner. */
		.timebox { display: flex; flex-direction: column; align-items: center; gap: 10px; }
		body.questions-on main { grid-template-rows: auto auto minmax(0, 1fr);
			grid-template-areas: "current next" "current clock" "notes clock"; }
		@media (orientation: portrait) {
			body.questions-on main { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr);
				grid-template-areas: "current current" "next clock" "notes clock"; }
		}
		body.questions-on .clock-col { justify-content: flex-start; align-items: stretch; gap: 8px; min-height: 0; }
		body.questions-on .timebox { flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 4px 14px; }
		body.questions-on .counter { font-size: 15px; width: 100%; text-align: center; }
		body.questions-on .clock { font-size: 24px; }
		body.questions-on .timer { font-size: 32px; padding: 0 6px; }
		body.questions-on #reset { font-size: 13px; padding: 3px 8px; }
		.questions { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--panel);
			border-radius: 6px; padding: 8px 10px; }
		.q-head { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
		.q-head .count { background: var(--warn); color: #000; border-radius: 10px; padding: 0 7px; font-weight: 600; }
		.q-head button { font-size: 13px; padding: 2px 8px; margin-left: auto; }
		.q-head button + button { margin-left: 0; }
		.q-head #q-reset { white-space: nowrap; }
		.q-head #q-reset.armed { border-color: var(--bad); color: var(--bad); }	/* "Tap again": waiting for its second tap */
		.questions ol { list-style: none; margin: 6px 0 0; padding: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1; }
		.questions li { padding: 8px 10px; border-radius: 6px; background: #2a2a2a; margin-bottom: 6px; font-size: 18px;
			line-height: 1.3; -webkit-user-select: text; user-select: text; transition: background 1s; }
		.questions li.fresh { background: #4a3d1c; }
		.questions li p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
		.questions li time { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }
		.questions .hint { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
		.questions form { display: flex; gap: 6px; margin-top: 8px; }
		.questions form input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 6px 8px; border-radius: 6px;
			border: 1px solid #3a3a3a; background: #111; color: var(--text); }
		.questions li .q-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
		.questions li .q-foot time { margin-top: 0; }
		.questions li .share { font-size: 13px; padding: 2px 9px; }
		.questions li .share:disabled { color: var(--ok); border-color: var(--ok); opacity: 0.8; }

		/* A word cloud's words, to show or hide (see showCloud); the questions
		   shared with the room (see showShared). */
		.cloud { flex: none; max-height: 45%; display: flex; flex-direction: column; min-height: 0;
			margin-top: 6px; padding-bottom: 8px; border-bottom: 1px solid #3a3a3a; }
		.cloud-head { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
		.cloud-head .what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		.cloud-head .what strong { color: var(--text); font-weight: 600; }
		.cloud-head button { font-size: 13px; padding: 2px 8px; flex: none; }
		.cloud-head #w-all { border-color: var(--warn); color: var(--warn); }
		.cloud-words { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
		.cloud-words button { font-size: 17px; padding: 4px 11px; border-radius: 15px; }
		.cloud-words button.pending { border-color: var(--warn); background: #4a3d1c; }
		.cloud-words button.shown { border-color: var(--ok); }
		.cloud-words button.hidden { color: var(--muted); text-decoration: line-through; }
		.cloud-words button.caught { border-color: var(--bad); background: #4a1f1c; }
		.cloud-words button.caught::before { content: '⚑ '; color: var(--bad); }
		.cloud-words .n { color: var(--muted); font-size: 13px; margin-left: 5px; }
		.cloud .hint { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
		.shared ol { list-style: none; margin: 6px 0 0; padding: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; flex: initial; }
		.shared li { display: flex; align-items: baseline; gap: 8px; padding: 5px 0; border-top: 1px solid #333; border-radius: 0;
			background: none; margin: 0; font-size: 16px; line-height: 1.3; }
		.shared li p { flex: 1; margin: 0; overflow-wrap: anywhere; }
		.shared .votes { flex: none; min-width: 2.6em; color: var(--warn); font-weight: 600; font-variant-numeric: tabular-nums; }
		.shared li button { flex: none; font-size: 13px; padding: 2px 8px; }

		/* The latest poll's count (see showPollCount); in the header, the pace
		   badge and the reactions of the last minute. */
		.pollcount { flex: none; margin-top: 6px; padding: 6px 8px; border-radius: 6px; background: #2a2a2a; font-size: 14px; color: var(--muted); }
		.pollcount strong { color: var(--text); font-weight: 600; }
		.pollcount .detail { color: var(--text); font-size: 15px; margin-top: 2px; font-variant-numeric: tabular-nums; }
		.pollcount.closed { opacity: 0.7; }
		.pace-badge { padding: 3px 9px; border-radius: 6px; background: var(--warn); color: #000; font-weight: 600; font-size: 14px; white-space: nowrap; }
		.pace-badge.many { background: var(--bad); color: #fff; }
		.reacts { font-size: 15px; white-space: nowrap; overflow: hidden; max-width: 40vw; }

		/* Driving the laptop's deck (presenter-driver.js): the current slide
		   alone, to write on, as large as fits, with the tools below it. */
		#drive.on { border-color: var(--ok); color: var(--ok); }
		body.driving main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; align-content: start;
			grid-template-areas: "current" "bar"; }
		body.driving .next-col, body.driving .notes, body.driving .clock-col { display: none; }
		body.driving .current { width: min(100%, calc((100dvh - 150px) * var(--deck-aspect))); justify-self: center; }
		.drive-surface { position: absolute; inset: 0; z-index: 3; touch-action: none; -webkit-touch-callout: none; cursor: crosshair; }
		.drive-bar { grid-area: bar; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
		.drive-bar button { min-width: 44px; min-height: 44px; font-size: 18px; }
		.drive-bar button.on { border-color: var(--ok); background: #1f3a24; }
		.drive-bar .colours { display: flex; flex-wrap: wrap; gap: 8px; }
		.drive-bar .swatch { min-width: 36px; min-height: 36px; width: 36px; height: 36px; padding: 0; border-radius: 50%; border: 2px solid #3a3a3a; }
		.drive-bar .swatch.on { outline: 3px solid var(--text); outline-offset: 2px; }
		.drive-bar .d-status { flex: 1; min-width: 8em; color: var(--warn); font-size: 14px; }
		.drive-bar .d-timer { font-size: 22px; font-variant-numeric: tabular-nums; }

		.start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
			gap: 14px; background: rgba(0, 0, 0, 0.8); text-align: center; padding: 24px; }
		.start button { font-size: 28px; padding: 14px 40px; background: var(--ok); color: #000; border: none; }
		.start p { color: var(--muted); max-width: 32em; line-height: 1.4; margin: 0; }
	</style>
</head>
<body>
	<header>
		<span class="status" id="status"><span class="dot"></span><span id="status-text">Connecting…</span></span>
		<span class="title" id="title"></span>
		<span class="spacer"></span>
		<span class="reacts" id="reacts" hidden title="Reactions in the last minute"></span>
		<span class="pace-badge" id="pace-badge" hidden></span>
		<button id="drive" hidden title="Write on the laptop’s slides with the Pencil, and step through the talk">Drive</button>
		<button id="reload" title="Reload this page and both copies of the deck, fetching every file afresh">Reload</button>
		<button id="smaller" aria-label="Smaller notes">A−</button>
		<button id="larger" aria-label="Larger notes">A+</button>
	</header>

	<main>
		<div class="frame current">
			<iframe id="current" title="Current slide" tabindex="-1"></iframe>
			<div class="badge" id="badge" hidden></div>
			<div class="mismatch" id="mismatch" role="alert" hidden></div>
			<div class="overlay-text" id="placeholder">
				Waiting for the presentation. On the laptop, open the deck with ?master=&lt;secret&gt; at the end of its address.
			</div>
			<div class="drive-surface" id="drive-surface" hidden></div>
		</div>
		<div class="next-col">
			<div class="label">Next</div>
			<div class="frame">
				<iframe id="upcoming" title="Next slide" tabindex="-1"></iframe>
				<div class="overlay-text" id="end" hidden>End of presentation</div>
			</div>
		</div>
		<div class="notes" id="notes"></div>
		<div class="clock-col">
			<div class="timebox">
				<div class="counter" id="counter"></div>
				<div class="clock" id="clock"></div>
				<button class="timer" id="timer" aria-label="Pause or resume the timer">0:00</button>
				<button id="reset">Reset timer</button>
			</div>
			<section class="questions" id="questions" hidden aria-label="Audience questions">
				<div class="q-head">
					<span id="q-status">Questions</span>
					<span class="count" id="q-count" hidden></span>
					<button id="q-clear" type="button">Clear</button>
					<button id="q-change-key" type="button">Key</button>
					<button id="q-reset" type="button" title="Start again: forget every poll’s answers and the board, and clear this screen">Reset</button>
				</div>
				<form id="q-keyform" hidden>
					<input id="q-key" type="password" placeholder="Questions key" autocomplete="off" autocapitalize="characters" spellcheck="false">
					<button type="submit">Connect</button>
				</form>
				<div class="pollcount" id="p-panel" hidden aria-live="polite">
					<div class="what" id="p-what"></div>
					<div class="detail" id="p-detail"></div>
				</div>
				<div class="cloud shared" id="b-panel" hidden aria-label="Questions shared with the room">
					<div class="cloud-head"><span class="what" id="b-what"></span></div>
					<ol id="b-list"></ol>
				</div>
				<div class="cloud" id="w-panel" hidden aria-label="Word cloud to approve">
					<div class="cloud-head">
						<span class="what" id="w-what"></span>
						<button id="w-all" type="button" hidden>Show all new</button>
						<button id="w-close" type="button" title="Hide this until new words arrive">Hide</button>
					</div>
					<div class="cloud-words" id="w-words"></div>
					<p class="hint" id="w-hint"></p>
				</div>
				<ol id="q-list"></ol>
				<p class="hint" id="q-empty">No questions yet.  Tap a question to dismiss it.</p>
			</section>
		</div>
		<div class="drive-bar" id="drive-bar" hidden>
			<button id="d-prev" type="button" aria-label="Back a step">◀&#xFE0E;</button>
			<button id="d-next" type="button" aria-label="Forward a step">▶&#xFE0E;</button>
			<button id="d-pen" type="button" title="Write on the slide, with the deck’s pen">Pen</button>
			<button id="d-board" type="button" title="Write on the chalkboard">Board</button>
			<button id="d-eraser" type="button">Eraser</button>
			<span class="colours" id="d-colours"></span>
			<button id="d-clear" type="button" title="Wipe this slide’s writing (the pen’s, or the board’s)">Clear</button>
			<span class="d-status" id="d-status" role="status"></span>
			<span class="d-timer" id="d-timer"></span>
			<button id="d-done" type="button">Done</button>
		</div>
	</main>

	<div class="start" id="start">
		<button id="start-button">Start</button>
		<p id="start-hint">Starts the timer and keeps the screen awake.</p>
	</div>

	<script>
	(function () {
		'use strict';
		const $ = id => document.getElementById(id);
		const config = window.PresenterConfig;
		if (!config || !config.relay || !config.channel) {
			$('placeholder').textContent = 'presenter-config.js is missing or incomplete: it must set PresenterConfig.relay and PresenterConfig.channel.';
			$('start').hidden = true;
			return;
		}
		const RELAY = config.relay.replace(/\/+$/, '');
		const CHANNEL = config.channel;
		const SILENT_MS = 3 * (config.heartbeatMs || 3000) + 1000;
		// What a plugin draws that the tablet's copies should not show.  The
		// current slide shows what the projector does, the deck's own controls
		// among it, so hideInFrames (both copies) hides only what never belongs
		// there: by default the menu plugin's open panel.  The next slide shows
		// the slide alone: reveal's arrows, progress bar and slide number are
		// switched off there, and hideInNext hides the plugins' controls too (by
		// default the menu's button, customcontrols' toolbar, and the
		// chalkboard's handle and palettes).
		const HIDE = config.hideInFrames || '.slide-menu-wrapper';
		const HIDE_NEXT = config.hideInNext
			|| '.slide-menu-button, #customcontrols, div.boardhandle, div.palette, .chalkboard-button, .board-button, #nextboard, #previousboard';
		const deckUrl = typeof config.deckUrl === 'function' ? config.deckUrl : path => path;

		const frames = { current: $('current'), upcoming: $('upcoming') };
		const loaded = { current: false, upcoming: false };
		let deck = null;		// path of the deck loaded
		let state = null;		// the laptop's latest Reveal state
		let applied = null;		// what render() last did, to detect drift
		let laptopSlides = null;	// how many slides the laptop's copy has (see checkCopies())
		let laptopBoard = null;		// its chalkboard: 'chalkboard' or 'whiteboard'
		let laptopGrid = null;		// and whether its grid shows
		let laptopScreen = null;	// what else its screen shows (see render() and presenter-mirror.js)
		let listenedCode = null;	// the question code, from the relay, with the key
		let lastHeard = 0;
		let socket = null;
		let relayFailed = false;
		let questionsKey = null;

		// socket.timeout() is Socket.IO 3 and later; an unmodified
		// reveal/multiplex relay serves 2.x.  The callback gets (err, reply).
		function emitTimed(s, ms, event, data, callback) {
			if (typeof s.timeout === 'function') return s.timeout(ms).emit(event, data, callback);
			let done = false;
			const timer = setTimeout(() => { if (!done) { done = true; callback(new Error('timeout')); } }, ms);
			s.emit(event, data, reply => { if (!done) { done = true; clearTimeout(timer); callback(null, reply); } });
		}

		// For presenter-driver.js (driving the laptop's deck from here),
		// presenter-ink.js (the laptop's ink, on the current slide here) and
		// presenter-mirror.js (what else the laptop's deck draws): the relay,
		// the key, the question code, the current slide's frame, and the
		// laptop's latest position (and its chalkboard's look, and its
		// screen's).  The socket is announced ('presenter-socket') once made,
		// each position ('presenter-state') as it arrives, a copy of the deck
		// ready ('presenter-frame', its name in detail), and the relay's
		// accepting the key ('presenter-listening').
		window.PresenterView = {
			channel: CHANNEL,
			frame: frames.current,
			emitTimed: emitTimed,
			get socket() { return socket; },
			get key() { return questionsKey; },
			get state() { return state; },
			get chalkboard() { return laptopBoard; },
			get chalkboardGrid() { return laptopGrid; },
			get screen() { return laptopScreen; },
			get code() { return listenedCode; },
			get ready() { return loaded.current; },
			// Put both copies in place again (a copy's mirror has just started).
			refresh: () => { applied = null; render(); }
		};

		// ---- The two copies of the deck

		// Each frame is laid out at a fixed width and scaled down to fit its box,
		// so the deck always sees a full-size window.  Sized to its box instead,
		// the next-slide frame is about 400px wide on a portrait iPad, and
		// reveal.js 5 turns any deck narrower than 435px into a scrolling page,
		// where setState() and next() scroll rather than jump and the frame shows
		// the wrong fragment.  Turning that off afterwards with
		// Reveal.configure({ scrollActivationWidth: null }) does not leave scroll
		// view once it is active.
		const FRAME_WIDTH = 1280;
		const scaler = new ResizeObserver(entries => {
			for (const e of entries) e.target.style.setProperty('--scale', e.contentRect.width / FRAME_WIDTH);
		});
		document.querySelectorAll('.frame').forEach(box => scaler.observe(box));

		// Match the frames to the deck's own aspect ratio (reveal's default is
		// 960x700, not 16:9).  Percentage sizes fall back to 16:9.
		function matchAspect(R) {
			const c = R.getConfig();
			if (typeof c.width !== 'number' || typeof c.height !== 'number') return;
			document.documentElement.style.setProperty('--deck-aspect', c.width + ' / ' + c.height);
			const height = Math.round(FRAME_WIDTH * c.height / c.width) + 'px';
			Object.values(frames).forEach(f => { f.style.height = height; });
		}

		function isSafePath(p) {
			return typeof p === 'string' && /^\/(?!\/)/.test(p) && !/[\s"'<>]/.test(p);
		}

		// ?presenter on a copy's address tells presenter-master.js there that it
		// is a copy on the tablet (a mirror of the laptop's: see
		// presenter-mirror.js), and lets a server-side template keep there the
		// slides it shows only in the live talk, as it does for ?master, so that
		// the copies match the laptop's.
		function asCopy(url) {
			const hash = url.indexOf('#');
			const base = hash < 0 ? url : url.slice(0, hash), rest = hash < 0 ? '' : url.slice(hash);
			return base + (base.includes('?') ? '&' : '?') + 'presenter' + rest;
		}

		function loadDeck(path) {
			deck = path;
			applied = null;
			loaded.current = loaded.upcoming = false;
			$('mismatch').hidden = true;
			for (const frame of Object.values(frames)) frame.src = asCopy(deckUrl(path));
			$('placeholder').hidden = true;
		}

		function whenReady(frame, fn) {
			const started = Date.now();
			(function poll() {
				let ready = false;
				try {
					const R = frame.contentWindow.Reveal;
					ready = !!(R && R.isReady && R.isReady());
				} catch (e) { /* not loaded yet, or not same-origin */ }
				if (ready) fn();
				else if (Date.now() - started < 60000) setTimeout(poll, 150);
				else $('status-text').textContent = 'Deck has no window.Reveal (or is on another origin)';
			})();
		}

		function silence(frame) {
			frame.contentDocument.querySelectorAll('video, audio').forEach(m => { m.muted = true; m.pause(); });
		}

		// A copy that follows: no keys, no swipes, no transitions, no hash in its
		// URL (which would otherwise fill the tablet's back-swipe history), and
		// no media; a tap never reaches it (pointer-events: none, above), so it
		// never moves by itself.  The current slide looks as the laptop's screen
		// does, with the deck's own controls (reveal's arrows, its progress bar
		// and slide number, a toolbar, the chalkboard's handle) and, from
		// presenter-ink.js, what is drawn there; presenter-driver.js makes them
		// work while driving.  The next slide shows the slide alone.
		function prepare(frame, key) {
			const chrome = key === 'current' ? {} : { controls: false, progress: false, slideNumber: false };
			frame.contentWindow.Reveal.configure(Object.assign(chrome, {
				help: false, keyboard: false, touch: false, hash: false, history: false,
				autoPlayMedia: false, transition: 'none', backgroundTransition: 'none'
			}));
			const style = frame.contentDocument.createElement('style');
			style.textContent = (key === 'current' ? HIDE : HIDE + ', ' + HIDE_NEXT) + ' { display: none !important; }';
			frame.contentDocument.head.appendChild(style);
			silence(frame);
		}

		for (const [key, frame] of Object.entries(frames)) {
			frame.addEventListener('load', () => {
				if (!frame.getAttribute('src')) return;
				whenReady(frame, () => {
					prepare(frame, key);
					if (key === 'current') {
						matchAspect(frame.contentWindow.Reveal);
						$('title').textContent = frame.contentDocument.title;
					}
					loaded[key] = true;
					render();
					checkCopies();
					document.dispatchEvent(new CustomEvent('presenter-frame', { detail: key }));
				});
			});
		}

		const position = s => s.indexh + '/' + s.indexv + '/' + s.indexf;

		function render() {
			if (!state || !loaded.current || !loaded.upcoming) return;
			const key = JSON.stringify([state, laptopScreen && laptopScreen.indexf]);
			const cur = frames.current.contentWindow.Reveal;
			const up = frames.upcoming.contentWindow.Reveal;

			// Skip a heartbeat with nothing new -- unless a frame is no longer
			// where it was put.  iPad Safari can reload an iframe in the
			// background to save memory, which leaves it on the first slide; the
			// next heartbeat then puts it back.
			if (applied && applied.key === key && position(cur.getState()) === applied.cur
				&& position(up.getState()) === applied.up) return;

			// The current slide as the laptop shows it, the overview or the
			// blanked screen among it (said in a badge too); the next one, the
			// slide itself.  A copy running presenter-master.js as a mirror has
			// the steps the laptop's deck alone has (its overlay charts), as the
			// laptop's does, so it takes the laptop's own fragment index
			// (screen.indexf), which the position it sends leaves them out of.
			const own = frame => frame.contentWindow.presenterMirror && laptopScreen && 'indexf' in laptopScreen
				? Object.assign({}, state, { indexf: laptopScreen.indexf }) : state;
			const base = Object.assign({}, own(frames.upcoming), { overview: false, paused: false });
			cur.setState(own(frames.current));
			up.setState(base);
			up.next();
			const after = up.getState();
			applied = { key: key, cur: position(cur.getState()), up: position(after) };

			$('end').hidden = position(after) !== position(base);
			Object.values(frames).forEach(silence);

			const flags = [];
			if (state.paused) flags.push('Screen blanked');
			if (state.overview) flags.push('Overview open');
			$('badge').textContent = flags.join(' · ');
			$('badge').hidden = !flags.length;

			const notes = (cur.getSlideNotes() || '').trim();
			$('notes').innerHTML = notes
				? notes.split(/\n\s*\n/).map(p => '<p>' + p + '</p>').join('')
				: '<p class="none">No notes for this slide.</p>';
			$('notes').scrollTop = 0;
			$('counter').textContent = 'Slide ' + (cur.getSlidePastCount() + 1) + ' of ' + cur.getTotalSlides();
		}

		// ---- The relay

		function onState(data) {
			if (!data || !data.state || !isSafePath(data.deck)) return;
			lastHeard = Date.now();
			if (data.deck !== deck) loadDeck(data.deck);
			state = data.state;
			// Each of these is absent from an older presenter-master.js.
			laptopSlides = Number.isInteger(data.slides) ? data.slides : null;
			laptopBoard = data.chalkboard === 'whiteboard' || data.chalkboard === 'chalkboard' ? data.chalkboard : null;
			laptopGrid = typeof data.chalkboardGrid === 'boolean' ? data.chalkboardGrid : null;
			laptopScreen = data.screen && typeof data.screen === 'object' ? data.screen : null;
			render();
			checkCopies();
			updateStatus();
			document.dispatchEvent(new CustomEvent('presenter-state'));
		}

		// The laptop says how many slides its copy has.  A different number here
		// means this is another version of the deck (edited on the laptop and
		// not yet uploaded, say), so the same position may be a different slide:
		// say so, across the current slide and in the status.
		function checkCopies() {
			let here = null;
			try {
				const R = frames.current.contentWindow.Reveal;
				if (loaded.current && R && R.isReady()) here = R.getTotalSlides();
			} catch (e) { /* reloading */ }
			const differ = laptopSlides !== null && here !== null && here !== laptopSlides;
			if (differ) $('mismatch').textContent = `This copy of the deck differs from the laptop’s (${here} slides here, `
				+ `${laptopSlides} there), so the slides shown may be wrong. Publish the deck again.`;
			if ($('mismatch').hidden === differ) { $('mismatch').hidden = !differ; updateStatus(); }
		}

		function updateStatus() {
			let level, text;
			if (relayFailed) { level = 'bad'; text = 'Relay unreachable'; }
			else if (!socket) { level = ''; text = 'Connecting…'; }
			else if (!socket.connected) { level = 'bad'; text = 'Reconnecting…'; }
			else if (Date.now() - lastHeard > SILENT_MS) {
				level = 'warn';
				text = lastHeard ? 'The laptop has gone quiet' : 'Waiting for the laptop';
			}
			else if (!$('mismatch').hidden) { level = 'warn'; text = 'Following, but the copies differ'; }
			else { level = 'ok'; text = 'Following'; }
			$('status').className = 'status ' + level;
			$('status-text').textContent = text;
		}

		const script = document.createElement('script');
		script.src = RELAY + '/socket.io/socket.io.js';
		script.onload = () => {
			// A WebSocket first, which is always a new connection: Socket.IO's
			// default starts with HTTP requests, which reuse the browser's last
			// connection to the relay, dead if the WebSocket's was.  Plain HTTP
			// if a WebSocket can't be had.
			socket = io(RELAY, { transports: ['websocket', 'polling'], tryAllTransports: true });
			document.dispatchEvent(new CustomEvent('presenter-socket'));
			socket.on(CHANNEL, onState);
			socket.on('connect', () => {
				// Ask for the latest position at once.  server/relay.js answers;
				// a plain reveal/multiplex relay ignores this, and the laptop's
				// next heartbeat does the job instead.
				socket.emit('presenter-hello', CHANNEL);
				updateStatus();
				listenForQuestions();
			});
			socket.on('disconnect', () => { updateStatus(); setQuestionStatus('Questions: reconnecting…'); });
			socket.on('question', addQuestion);
			socket.on('poll-words', showCloud);
			socket.on('poll-count', showPollCount);
			socket.on('board', showShared);
			socket.on('reset', clearForReset);
			socket.on('reaction', countReaction);
			socket.on('pace', showPace);
			updateStatus();
		};

		// ---- Audience questions (ask.html)
		//
		// The laptop opens questions on the relay; this page listens with a key
		// entered once and remembered on this device.  Questions live only in this
		// page: nothing is stored, and a reload starts with an empty list.  Only a
		// question shared with the room (its Share button) is kept, by the relay,
		// for the phones to vote on.

		const QUESTIONS = /^[0-9a-f]{64}$/.test(config.questionsKey || '');
		const KEY_STORE = 'presenter-questions-key';
		let retryListen = null;
		if (QUESTIONS) {
			document.body.classList.add('questions-on');
			$('questions').hidden = false;
			try { questionsKey = localStorage.getItem(KEY_STORE); } catch (e) { /* storage blocked */ }
			if (!questionsKey) showKeyForm();
			else markLecturer();
		}

		// A tablet with the key is the lecturer's, as a browser that has opened
		// a deck with ?master is (presenter-master.js): so the copies here show
		// the question button in their toolbar, as the laptop's does.  (From
		// the next copy loaded.)
		function markLecturer() {
			try { localStorage.setItem('presenter-lecturer', '1'); } catch (e) { /* storage blocked */ }
		}

		function setQuestionStatus(text) { $('q-status').textContent = text; }

		function showKeyForm(message) {
			$('q-keyform').hidden = false;
			setQuestionStatus(message || 'Enter the questions key');
		}

		function listenForQuestions() {
			if (!QUESTIONS || !questionsKey || !socket || !socket.connected) return;
			clearTimeout(retryListen);
			socket.emit('questions-listen', { channel: CHANNEL, key: questionsKey }, res => {
				if (res && res.ok) {
					$('q-keyform').hidden = true;
					setQuestionStatus(res.code ? 'Questions on · code ' + res.code : 'Questions on');
					listenedCode = /^\d{4}$/.test(res.code) ? res.code : null;
					markLecturer();
					document.dispatchEvent(new CustomEvent('presenter-listening'));
				}
				else if (res && res.reason === 'key') {
					questionsKey = null;
					try { localStorage.removeItem(KEY_STORE); } catch (e) { /* storage blocked */ }
					showKeyForm('That key was not accepted');
				}
				else {
					// Questions open only once the laptop deck is running with ?master.
					setQuestionStatus('Questions: waiting for the laptop');
					retryListen = setTimeout(listenForQuestions, 5000);
				}
			});
		}

		$('q-keyform').addEventListener('submit', e => {
			e.preventDefault();
			const key = $('q-key').value.trim().toUpperCase();
			if (!key) return;
			questionsKey = key;
			$('q-key').value = '';
			try { localStorage.setItem(KEY_STORE, key); } catch (e2) { /* storage blocked */ }
			setQuestionStatus('Connecting…');
			listenForQuestions();
		});
		$('q-change-key').addEventListener('click', () => showKeyForm());

		function updateQuestionCount() {
			const n = $('q-list').children.length;
			$('q-count').textContent = n;
			$('q-count').hidden = n === 0;
			$('q-empty').hidden = n > 0;
		}

		function addQuestion(q) {
			if (!q || typeof q.text !== 'string' || !q.text) return;
			const item = document.createElement('li');
			const text = document.createElement('p');
			text.textContent = q.text;			// never innerHTML: this is anonymous input
			const time = document.createElement('time');
			time.dataset.at = Number(q.at) || Date.now();
			// Share: put it on the board, for the room to vote on.
			const share = document.createElement('button');
			share.type = 'button';
			share.className = 'share';
			share.textContent = 'Share';
			share.title = 'Put this on the board, for the room to vote on';
			share.addEventListener('click', e => { e.stopPropagation(); shareQuestion(q.text, share); });
			const foot = document.createElement('div');
			foot.className = 'q-foot';
			foot.append(time, share);
			item.append(text, foot);
			item.className = 'fresh';
			item.addEventListener('click', () => { item.remove(); updateQuestionCount(); });
			$('q-list').prepend(item);
			while ($('q-list').children.length > 50) $('q-list').lastElementChild.remove();
			setTimeout(() => item.classList.remove('fresh'), 4000);
			updateQuestionCount();
			updateQuestionTimes();
		}

		function updateQuestionTimes() {
			for (const time of $('q-list').querySelectorAll('time')) {
				const minutes = Math.floor((Date.now() - Number(time.dataset.at)) / 60000);
				time.textContent = minutes < 1 ? 'just now' : minutes + ' min ago';
			}
		}

		$('q-clear').addEventListener('click', () => { $('q-list').replaceChildren(); updateQuestionCount(); });

		// ---- Reset: start again from a clean state (after a rehearsal, say).
		// The relay forgets this channel's polls, their answers and the
		// versions it dealt, the board and "Lost?"; a poll open now opens
		// again, empty.  Every tablet listening (and the laptop) is told
		// ('reset'), and clears its screen: the questions, the latest poll and
		// the word cloud.  It takes a second tap within a few seconds, rather
		// than a confirm() dialog.
		let resetArmed = null;
		const resetButton = (text, armed) => { $('q-reset').textContent = text; $('q-reset').classList.toggle('armed', !!armed); };
		$('q-reset').addEventListener('click', () => {
			if (!resetArmed) {
				resetButton('Tap again', true);
				resetArmed = setTimeout(() => { resetArmed = null; resetButton('Reset'); }, 4000);
				return;
			}
			clearTimeout(resetArmed);
			resetArmed = null;
			if (!socket || !socket.connected || !questionsKey) {
				resetButton('Not connected');
				setTimeout(() => resetButton('Reset'), 3000);
				return;
			}
			resetButton('Resetting…');
			// A relay from before the reset never answers: hence the timeout.
			emitTimed(socket, 5000, 'reset', { channel: CHANNEL, key: questionsKey }, (err, res) => {
				resetButton(!err && res && res.ok ? 'Reset done' : 'Not reset');
				$('q-reset').title = !err && res && res.ok ? 'Start again: forget every poll’s answers and the board, and clear this screen'
					: 'The relay did not reset: ' + (err ? 'no reply' : (res && res.reason) || 'refused');
				setTimeout(() => resetButton('Reset'), 3000);
			});
		});

		function clearForReset() {
			$('q-list').replaceChildren();
			updateQuestionCount();
			$('p-panel').hidden = true;
			$('p-what').replaceChildren();
			$('p-detail').textContent = '';
			cloud = null;
			cloudPutAway = null;
			$('w-panel').hidden = true;
		}

		// ---- A word cloud's words (a words poll on the laptop deck)
		//
		// The relay sends this page every word a phone gives, grouped, with how
		// many gave it; none reaches the screen until shown here.  Tap a word
		// to show it, or to hide it again; "Show all new" shows every word not
		// yet decided.  "Hide" puts the panel away until a new word arrives.
		// A word the relay's filter caught is flagged ⚑ and held even in a
		// cloud that otherwise shows every word at once.

		let cloud = null, cloudPutAway = null;	// the latest message; the poll id and word keys when put away
		function showCloud(m) {
			if (!m || typeof m.id !== 'string' || !Array.isArray(m.words)) return;
			cloud = m;
			const pending = m.words.filter(w => w.status === 'pending');
			if (cloudPutAway && cloudPutAway.id === m.id && pending.every(w => cloudPutAway.keys.has(w.key))) { $('w-panel').hidden = true; return; }
			cloudPutAway = null;
			$('w-panel').hidden = false;
			const shown = m.words.filter(w => w.status === 'shown').length;
			const prompt = document.createElement('strong');
			prompt.textContent = m.prompt || m.id;
			$('w-what').replaceChildren('Word cloud: ', prompt, ` · ${m.open ? 'open' : 'closed'} · ${pending.length} new, ${shown} shown`);
			const fresh = pending.filter(w => !w.caught);		// see the w-all button
			$('w-all').hidden = fresh.length === 0;
			$('w-all').textContent = `Show all new (${fresh.length})`;
			$('w-words').replaceChildren(...m.words.map(w => {
				const b = document.createElement('button');
				b.type = 'button';
				b.className = w.status;
				b.textContent = w.word;				// never innerHTML: this is what the audience typed
				b.title = w.status === 'shown' ? 'Shown: tap to hide' : w.status === 'hidden' ? 'Hidden: tap to show' : 'New: tap to show';
				if (w.caught) {
					b.classList.add('caught');
					b.title = 'Held by the word filter: ' + b.title.toLowerCase();
				}
				if (w.n > 1) {
					const n = document.createElement('span');
					n.className = 'n';
					n.textContent = '×' + w.n;
					b.append(n);
				}
				b.addEventListener('click', () => moderate({ word: w.key, status: w.status === 'shown' ? 'hidden' : 'shown' }));
				return b;
			}));
			$('w-hint').textContent = !m.words.length ? (m.moderated ? 'Words appear here as they arrive; tap one to put it on the screen.' : 'Words go straight to the screen; tap one to hide it.')
				: m.moderated ? 'Tap a word to show it on the screen, or to hide it.'
				: m.words.some(w => w.caught && w.status === 'pending') ? 'Words go straight to the screen, except those the filter flagged (⚑): tap one to show it, or any word to hide it.'
				: 'This poll shows every word at once; tap one to hide it.';
		}

		function moderate(change) {
			if (!cloud || !socket || !socket.connected || !questionsKey) return;
			socket.emit('poll-moderate', Object.assign({ channel: CHANNEL, key: questionsKey, id: cloud.id }, change), res => {
				if (!res || !res.ok) $('w-hint').textContent = 'That didn’t go through (' + ((res && res.reason) || 'no reply') + ').  Try again.';
			});
		}
		// "Show all new" passes over the words the filter flagged, each of which
		// is shown only by a tap of its own.  (So in a cloud that shows words at
		// once, where only flagged words wait, it never appears.)
		$('w-all').addEventListener('click', () => {
			const pending = cloud ? cloud.words.filter(w => w.status === 'pending') : [];
			if (pending.some(w => w.caught)) pending.filter(w => !w.caught).forEach(w => moderate({ word: w.key, status: 'shown' }));
			else moderate({ all: true, status: 'shown' });
		});
		$('w-close').addEventListener('click', () => {
			if (cloud) cloudPutAway = { id: cloud.id, keys: new Set(cloud.words.map(w => w.key)) };
			$('w-panel').hidden = true;
		});

		// ---- The latest poll: how many have answered, and how it stands, so the
		// presenter can see without turning to the screen.

		function showPollCount(m) {
			if (!m || typeof m.id !== 'string') return;
			// Only one poll is open at a time, so another one opening has closed
			// the word cloud (the relay says so only when a cloud is closed outright).
			if (cloud && cloud.open && m.open && m.id !== cloud.id) showCloud(Object.assign({}, cloud, { open: false }));
			const prompt = document.createElement('strong');
			prompt.textContent = m.prompt || m.id;
			$('p-what').replaceChildren(`${m.open ? 'Poll open' : 'Poll closed'}: `, prompt, ` · ${m.total} answer${m.total === 1 ? '' : 's'}`);
			const detail = $('p-detail');
			if (Array.isArray(m.options) && Array.isArray(m.counts)) detail.textContent = m.options.map((o, k) => `${o} ${m.counts[k]}`).join(' · ');
			else if (typeof m.median === 'number') {
				const unit = (m.unit || '').split('|').pop();
				detail.textContent = `median ${m.median}${unit ? ' ' + unit : ''} · mean ${m.mean}${unit ? ' ' + unit : ''}`;
			}
			else detail.textContent = '';
			$('p-panel').hidden = false;
			$('p-panel').classList.toggle('closed', !m.open);
		}

		// ---- The board: questions shared from here, which the room votes on.
		// "Share" on a question puts it there; "Answered" takes it down.

		function shareQuestion(text, button) {
			if (!socket || !socket.connected || !questionsKey) return;
			button.disabled = true;
			socket.emit('board-share', { channel: CHANNEL, key: questionsKey, text: text }, res => {
				button.textContent = res && res.ok ? 'Shared' : 'Not shared';
				if (!(res && res.ok)) button.disabled = false;
			});
		}

		function showShared(b) {
			if (!b || !Array.isArray(b.items)) return;
			$('b-panel').hidden = !b.items.length;
			$('b-what').textContent = `Shared with the room · ${b.items.length} · most votes first`;
			$('b-list').replaceChildren(...b.items.map(item => {
				const li = document.createElement('li');
				const votes = document.createElement('span');
				votes.className = 'votes';
				votes.textContent = '▲ ' + item.votes;
				const text = document.createElement('p');
				text.textContent = item.text;			// never innerHTML: what someone in the audience typed
				const done = document.createElement('button');
				done.type = 'button';
				done.textContent = 'Answered';
				done.title = 'Take it off the board';
				done.addEventListener('click', () => {
					if (socket && socket.connected) socket.emit('board-remove', { channel: CHANNEL, key: questionsKey, id: item.id }, () => {});
				});
				li.append(votes, text, done);
				return li;
			}));
		}

		// ---- How many have said they are lost (the ask page's "Lost?"), over
		// the last two minutes; and the reactions of the last minute.

		function showPace(m) {
			if (!m || typeof m.lost !== 'number') return;
			const badge = $('pace-badge');
			badge.hidden = !m.lost;
			badge.textContent = `Lost: ${m.lost}` + (m.audience ? ` of ${m.audience}` : '');
			badge.classList.toggle('many', m.audience > 0 && m.lost / m.audience >= 0.15);
			badge.title = 'Phones whose owners said they were lost in the last two minutes, out of those on the ask page';
		}

		const reactions = [];		// [emoji, time]
		function countReaction(r) {
			if (!r || typeof r.emoji !== 'string' || r.emoji.length > 16) return;
			reactions.push([r.emoji, Date.now()]);
			showReactions();
		}
		function showReactions() {
			while (reactions.length && Date.now() - reactions[0][1] > 60000) reactions.shift();
			const counts = new Map();
			reactions.forEach(([e]) => counts.set(e, (counts.get(e) || 0) + 1));
			$('reacts').textContent = [...counts].map(([e, n]) => `${e} ${n}`).join('  ');
			$('reacts').hidden = !counts.size;
		}

		script.onerror = () => { relayFailed = true; updateStatus(); };
		document.head.appendChild(script);

		// ---- Clock, timer and notes size

		let timerRunning = false, timerStart = 0, timerBanked = 0;
		const elapsed = () => timerBanked + (timerRunning ? Date.now() - timerStart : 0);
		function format(ms) {
			const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
			const ss = String(s % 60).padStart(2, '0');
			return h ? h + ':' + String(m).padStart(2, '0') + ':' + ss : m + ':' + ss;
		}
		$('timer').addEventListener('click', () => {
			if (timerRunning) timerBanked = elapsed(); else timerStart = Date.now();
			timerRunning = !timerRunning;
			$('timer').classList.toggle('paused', !timerRunning);
		});
		$('reset').addEventListener('click', () => { timerBanked = 0; timerStart = Date.now(); });

		// After Reload (below), the timer as it was, still counting through the
		// reload if it was running; Start, which the wake lock still needs,
		// then leaves it alone.
		const TIMER_STORE = 'presenter-timer';
		let resumed = false;
		try {
			const saved = JSON.parse(sessionStorage.getItem(TIMER_STORE));
			sessionStorage.removeItem(TIMER_STORE);
			if (saved && Number.isFinite(saved.elapsed) && Number.isFinite(saved.at)) {
				timerBanked = saved.elapsed + (saved.running ? Date.now() - saved.at : 0);
				timerStart = Date.now();
				timerRunning = !!saved.running;
				$('timer').classList.toggle('paused', !timerRunning);
				resumed = true;
			}
		} catch (e) { /* nothing saved, or storage blocked */ }

		function tick() {
			$('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
			$('timer').textContent = format(elapsed());
			updateStatus();
			if (QUESTIONS) updateQuestionTimes();
			if (reactions.length) showReactions();
		}
		setInterval(tick, 500);
		tick();

		let notesSize = 22;
		try { notesSize = Number(localStorage.getItem('presenter-notes-size')) || 22; } catch (e) { /* storage blocked */ }
		function setNotesSize(px) {
			notesSize = Math.min(44, Math.max(14, px));
			document.documentElement.style.setProperty('--notes-size', notesSize + 'px');
			try { localStorage.setItem('presenter-notes-size', notesSize); } catch (e) { /* storage blocked */ }
		}
		$('smaller').addEventListener('click', () => setNotesSize(notesSize - 2));
		$('larger').addEventListener('click', () => setNotesSize(notesSize + 2));
		setNotesSize(notesSize);

		// ---- Start: the timer, and a wake lock so the tablet does not sleep
		// mid-talk.  iOS releases the lock whenever the page is hidden, so it is
		// requested again on return.

		let started = false;
		async function keepAwake() {
			try { await navigator.wakeLock.request('screen'); } catch (e) { /* unsupported or refused */ }
		}
		if (!('wakeLock' in navigator)) {
			$('start-hint').textContent = 'Starts the timer. This browser cannot keep the screen awake, so turn off auto-lock.';
		}
		if (resumed) {
			$('start-button').textContent = 'Resume';
			$('start-hint').textContent = 'The timer carries on from before the reload'
				+ ('wakeLock' in navigator ? '; this keeps the screen awake again.' : '. This browser cannot keep the screen awake, so turn off auto-lock.');
		}
		$('start-button').addEventListener('click', () => {
			started = true;
			keepAwake();
			if (!resumed) { timerBanked = 0; timerStart = Date.now(); timerRunning = true; }
			$('start').hidden = true;
		});
		document.addEventListener('visibilitychange', () => {
			if (started && document.visibilityState === 'visible') keepAwake();
		});

		// ---- Reload: this page and both copies of the deck, as a hard reload.
		// A Home Screen web app has no reload button, and a server may let it
		// keep static files for weeks; location.reload() alone may take a
		// deck's scripts, pictures and stylesheets from the cache again.  So
		// every file of this site that the page and its copies have loaded is
		// first fetched with cache: 'reload', which replaces the cached copy,
		// and the page reloads once all have come (or after 20 s).  Other
		// sites' files (a CDN's, the relay's socket.io) are theirs to manage.
		// The key is in localStorage, so it survives; the timer is carried over
		// (above); the questions on screen are not kept, by design.  Two taps,
		// as Reset takes.
		function siteFiles() {
			const urls = new Set([location.href]);
			for (const w of [window, frames.current.contentWindow, frames.upcoming.contentWindow]) {
				try {
					w.performance.getEntriesByType('resource').forEach(e => urls.add(e.name));
					// (The entries' buffer can fill in a long talk; these never go missing.)
					w.document.querySelectorAll('link[rel="stylesheet"][href], script[src], img[src]')
						.forEach(e => urls.add(e.href || e.src));
				} catch (e) { /* a copy not loaded */ }
			}
			return [...urls].filter(u => {
				try {
					const url = new URL(u);
					return url.origin === location.origin && !url.pathname.includes('/socket.io/');	// (a relay on this site)
				}
				catch (e) { return false; }
			});
		}
		let reloadArmed = null, reloading = false;
		const reloadButton = (text, armed) => { $('reload').textContent = text; $('reload').classList.toggle('armed', !!armed); };
		$('reload').addEventListener('click', async () => {
			if (reloading) return;
			if (!reloadArmed) {
				reloadButton('Tap again', true);
				reloadArmed = setTimeout(() => { reloadArmed = null; reloadButton('Reload'); }, 4000);
				return;
			}
			clearTimeout(reloadArmed);
			reloading = true;
			const urls = siteFiles();
			reloadButton('Fetching ' + urls.length + ' files…');
			await Promise.race([
				Promise.allSettled(urls.map(u => fetch(u, { cache: 'reload', credentials: 'same-origin' }))),
				new Promise(resolve => setTimeout(resolve, 20000))
			]);
			if (started) {
				try { sessionStorage.setItem(TIMER_STORE, JSON.stringify({ elapsed: elapsed(), running: timerRunning, at: Date.now() })); }
				catch (e) { /* storage blocked: the timer starts again */ }
			}
			location.reload();
		});

		const initial = new URLSearchParams(location.search).get('deck');
		if (isSafePath(initial)) loadDeck(initial);
	})();
	</script>
	<!-- With questions on (and the key): Drive, the laptop's ink, and what else
	     the laptop's deck draws, on this page's copies.  Each does nothing
	     without PresenterView and questions. -->
	<script src="presenter-driver.js"></script>
	<script src="presenter-ink.js"></script>
	<script src="presenter-mirror.js"></script>
</body>
</html>
