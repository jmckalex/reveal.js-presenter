# nginx in front of the relay: TLS, plus the WebSocket upgrade Socket.IO needs.
# Replace relay.example.org, then get a certificate, e.g.
#   certbot --nginx -d relay.example.org
#
# The presenter page and the decks are usually served over HTTPS, and a page on
# HTTPS cannot open a plain-HTTP or ws:// connection, so the relay needs TLS too.

server {
	listen 80;
	listen [::]:80;
	server_name relay.example.org;
	location /.well-known/acme-challenge/ { root /var/www/html; }
	location / { return 301 https://$host$request_uri; }
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name relay.example.org;

	ssl_certificate     /etc/letsencrypt/live/relay.example.org/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/relay.example.org/privkey.pem;

	location / {
		proxy_pass http://127.0.0.1:1948;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		# Socket.IO's long-polling fallback holds requests open.
		proxy_read_timeout 120s;
	}
}
